<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" role="img" aria-label="Podcast lower-third template">
  <title>Podcast lower-third — Built for Exit broadcast plate</title>
  <!-- transparent over video; this preview shows it on a neutral video frame -->
  <rect width="1280" height="200" fill="#1A1A1D"/>
  <!-- hollow-4 badge -->
  <g transform="translate(56,52) scale(0.78)"><path fill="#DFFF00" fill-rule="evenodd" d="M68 8 L96 8 L96 122 L70 122 L70 96 L8 96 L8 72 Z M70 20 L70 72 L30 72 Z"/></g>
  <!-- name plate -->
  <rect x="170" y="56" width="520" height="88" rx="10" fill="#050505" stroke="#2D2D31"/>
  <line x1="170" y1="56" x2="170" y2="144" stroke="#DFFF00" stroke-width="4"/>
  <text x="196" y="100" font-size="32" font-weight="800" letter-spacing="0.5" fill="#F3F3F3">GUEST NAME</text>
  <text x="196" y="130" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#9A9A9F">Title · Company</text>
  <!-- show tag -->
  <text x="1224" y="106" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="15" letter-spacing="2" fill="#9A9A9F">BUILT FOR EXIT</text>
</svg>
