<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" role="img" aria-label="Founder dependency diagram">
  <title>Dependency diagram — founder at center, everything connected</title>
  <rect width="640" height="480" fill="#050505"/>
  <g stroke="#2D2D31" stroke-width="1.5">
    <line x1="320" y1="240" x2="320" y2="80"/>
    <line x1="320" y1="240" x2="540" y2="150"/>
    <line x1="320" y1="240" x2="560" y2="330"/>
    <line x1="320" y1="240" x2="380" y2="430"/>
    <line x1="320" y1="240" x2="100" y2="330"/>
    <line x1="320" y1="240" x2="80" y2="150"/>
  </g>
  <!-- outer nodes -->
  <g font-size="13" font-weight="600" fill="#9A9A9F" text-anchor="middle">
    <g><rect x="262" y="50" width="116" height="44" rx="8" fill="#1A1A1D" stroke="#2D2D31"/><text x="320" y="77">SALES</text></g>
    <g><rect x="486" y="128" width="120" height="44" rx="8" fill="#1A1A1D" stroke="#2D2D31"/><text x="546" y="155">OPERATIONS</text></g>
    <g><rect x="500" y="308" width="120" height="44" rx="8" fill="#1A1A1D" stroke="#2D2D31"/><text x="560" y="335">FINANCE</text></g>
    <g><rect x="322" y="408" width="116" height="44" rx="8" fill="#1A1A1D" stroke="#2D2D31"/><text x="380" y="435">DELIVERY</text></g>
    <g><rect x="40" y="308" width="120" height="44" rx="8" fill="#1A1A1D" stroke="#2D2D31"/><text x="100" y="335">HIRING</text></g>
    <g><rect x="20" y="128" width="120" height="44" rx="8" fill="#1A1A1D" stroke="#2D2D31"/><text x="80" y="155">DECISIONS</text></g>
  </g>
  <!-- center: founder -->
  <circle cx="320" cy="240" r="58" fill="#050505" stroke="#DFFF00" stroke-width="2.5"/>
  <text x="320" y="236" text-anchor="middle" font-size="18" font-weight="800" fill="#F3F3F3">FOUNDER</text>
  <text x="320" y="258" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1" fill="#DFFF00">SINGLE POINT</text>
</svg>
