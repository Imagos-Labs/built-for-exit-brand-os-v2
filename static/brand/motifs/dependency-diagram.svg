<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" role="img" aria-label="Owner dependency: every function runs through the founder">
  <title>Owner dependency — every function runs through the founder</title>
  <defs>
    <radialGradient id="founderGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DFFF00" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#DFFF00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#DFFF00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="760" height="660" fill="#050505"/>

  <!-- dashed connectors: founder -> each function -->
  <g stroke="#DFFF00" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="5 6">
    <line x1="380" y1="300" x2="380" y2="90"/>
    <line x1="380" y1="300" x2="544" y2="169"/>
    <line x1="380" y1="300" x2="585" y2="347"/>
    <line x1="380" y1="300" x2="471" y2="489"/>
    <line x1="380" y1="300" x2="309" y2="489"/>
    <line x1="380" y1="300" x2="175" y2="347"/>
    <line x1="380" y1="300" x2="216" y2="169"/>
  </g>

  <!-- ============ outer function nodes ============ -->
  <g>
    <!-- SALES (gauge) @ 380,90 -->
    <circle cx="380" cy="90" r="38" fill="#0F0F10" stroke="#2D2D31" stroke-width="1.5"/>
    <g transform="translate(366,76)" fill="none" stroke="#F3F3F3" stroke-width="2" stroke-linecap="round">
      <path d="M4 19 A10 10 0 0 1 24 19"/><path d="M14 19 L20 11"/>
      <circle cx="14" cy="19" r="1.6" fill="#F3F3F3" stroke="none"/>
    </g>
    <text x="380" y="155" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#9A9A9F">SALES</text>

    <!-- OPERATIONS (gear) @ 544,169 -->
    <circle cx="544" cy="169" r="38" fill="#0F0F10" stroke="#2D2D31" stroke-width="1.5"/>
    <g transform="translate(530,155)" fill="none" stroke="#F3F3F3" stroke-width="2" stroke-linecap="round">
      <circle cx="14" cy="14" r="6"/><circle cx="14" cy="14" r="2" fill="#F3F3F3" stroke="none"/>
      <path d="M14 3 v4 M14 25 v-4 M3 14 h4 M25 14 h-4 M6.2 6.2 l2.8 2.8 M21.8 21.8 l-2.8-2.8 M21.8 6.2 l-2.8 2.8 M6.2 21.8 l2.8-2.8"/>
    </g>
    <text x="544" y="234" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#9A9A9F">OPERATIONS</text>

    <!-- DELIVERY (box) @ 585,347 -->
    <circle cx="585" cy="347" r="38" fill="#0F0F10" stroke="#2D2D31" stroke-width="1.5"/>
    <g transform="translate(571,333)" fill="none" stroke="#F3F3F3" stroke-width="2" stroke-linejoin="round">
      <path d="M14 4 L24 9 L24 20 L14 25 L4 20 L4 9 Z"/><path d="M4 9 L14 14 L24 9"/><path d="M14 14 L14 25"/>
    </g>
    <text x="585" y="412" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#9A9A9F">DELIVERY</text>

    <!-- FINANCE (bars) @ 471,489 -->
    <circle cx="471" cy="489" r="38" fill="#0F0F10" stroke="#2D2D31" stroke-width="1.5"/>
    <g transform="translate(457,475)" stroke="#F3F3F3" stroke-width="3" stroke-linecap="square">
      <path d="M5 24 V17"/><path d="M14 24 V10"/><path d="M23 24 V4"/>
      <path d="M3 25 H25" stroke-width="1.5"/>
    </g>
    <text x="471" y="554" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#9A9A9F">FINANCE</text>

    <!-- CLIENTS (people) @ 309,489 -->
    <circle cx="309" cy="489" r="38" fill="#0F0F10" stroke="#2D2D31" stroke-width="1.5"/>
    <g transform="translate(295,476)" fill="none" stroke="#F3F3F3" stroke-width="2" stroke-linecap="round">
      <circle cx="10" cy="9" r="4"/><path d="M3 23 a7 7 0 0 1 14 0"/>
      <circle cx="20" cy="11" r="3.5"/><path d="M15 23 a6 6 0 0 1 12 0"/>
    </g>
    <text x="309" y="554" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#9A9A9F">CLIENTS</text>

    <!-- HIRING (person+) @ 175,347 -->
    <circle cx="175" cy="347" r="38" fill="#0F0F10" stroke="#2D2D31" stroke-width="1.5"/>
    <g transform="translate(161,333)" fill="none" stroke="#F3F3F3" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="10" r="4.5"/><path d="M3 25 a8 8 0 0 1 16 0"/>
      <path d="M22 4 v7 M18.5 7.5 h7"/>
    </g>
    <text x="175" y="412" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#9A9A9F">HIRING</text>

    <!-- PRODUCT (layers) @ 216,169 -->
    <circle cx="216" cy="169" r="38" fill="#0F0F10" stroke="#2D2D31" stroke-width="1.5"/>
    <g transform="translate(202,155)" fill="none" stroke="#F3F3F3" stroke-width="2" stroke-linejoin="round">
      <path d="M14 4 L25 10 L14 16 L3 10 Z"/><path d="M3 15 L14 21 L25 15"/><path d="M3 20 L14 26 L25 20"/>
    </g>
    <text x="216" y="234" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#9A9A9F">PRODUCT</text>
  </g>

  <!-- ============ founder hub (the bottleneck) ============ -->
  <circle cx="380" cy="300" r="110" fill="url(#founderGlow)"/>
  <circle cx="380" cy="300" r="52" fill="#0F0F10" stroke="#DFFF00" stroke-width="2.5"/>
  <g transform="translate(362,278)" fill="none" stroke="#DFFF00" stroke-width="2.5" stroke-linecap="round">
    <circle cx="18" cy="11" r="7"/><path d="M4 33 a14 14 0 0 1 28 0"/>
  </g>
  <text x="380" y="372" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="0.5" fill="#DFFF00">FOUNDER</text>

  <!-- the problem stated -->
  <text x="380" y="612" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.3" fill="#F3F3F3">OWNER DEPENDENCY IS THE MOST</text>
  <text x="380" y="640" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="0.3" fill="#F3F3F3"><tspan fill="#DFFF00">EXPENSIVE</tspan> THING IN YOUR BUSINESS.</text>
</svg>
