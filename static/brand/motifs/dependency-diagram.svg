<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" role="img" aria-label="Owner dependency is a problem: everything runs through the founder">
  <title>Owner dependency — the founder is the single point of failure</title>
  <defs>
    <marker id="arrowIn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#DFFF00"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#050505"/>

  <!-- dependency flows INTO the founder (arrowheads point inward) -->
  <g stroke="#2D2D31" stroke-width="1.5" fill="none">
    <line x1="320" y1="72"  x2="320"   y2="158"   marker-end="url(#arrowIn)"/>
    <line x1="546" y1="150" x2="387.7" y2="205.4" marker-end="url(#arrowIn)"/>
    <line x1="560" y1="330" x2="386.5" y2="257.7" marker-end="url(#arrowIn)"/>
    <line x1="380" y1="430" x2="340.7" y2="299"   marker-end="url(#arrowIn)"/>
    <line x1="100" y1="330" x2="254.5" y2="259.8" marker-end="url(#arrowIn)"/>
    <line x1="80"  y1="150" x2="251.7" y2="207.2" marker-end="url(#arrowIn)"/>
  </g>

  <!-- outer function nodes -->
  <g font-size="13" font-weight="600" fill="#9A9A9F" text-anchor="middle">
    <g><rect x="262" y="50"  width="116" height="44" rx="8" fill="#1A1A1D" stroke="#2D2D31"/><text x="320" y="77">SALES</text></g>
    <g><rect x="486" y="128" width="120" height="44" rx="8" fill="#1A1A1D" stroke="#2D2D31"/><text x="546" y="155">OPERATIONS</text></g>
    <g><rect x="500" y="308" width="120" height="44" rx="8" fill="#1A1A1D" stroke="#2D2D31"/><text x="560" y="335">FINANCE</text></g>
    <g><rect x="322" y="408" width="116" height="44" rx="8" fill="#1A1A1D" stroke="#2D2D31"/><text x="380" y="435">DELIVERY</text></g>
    <g><rect x="40"  y="308" width="120" height="44" rx="8" fill="#1A1A1D" stroke="#2D2D31"/><text x="100" y="335">HIRING</text></g>
    <g><rect x="20"  y="128" width="120" height="44" rx="8" fill="#1A1A1D" stroke="#2D2D31"/><text x="80"  y="155">DECISIONS</text></g>
  </g>

  <!-- center: the founder, the alarm-yellow bottleneck -->
  <circle cx="320" cy="230" r="62" fill="#DFFF00"/>
  <text x="320" y="226" text-anchor="middle" font-size="20" font-weight="800" fill="#050505">FOUNDER</text>
  <text x="320" y="250" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10.5" letter-spacing="0.5" fill="#050505">BOTTLENECK</text>

  <!-- the problem stated -->
  <text x="320" y="500" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="0.3" fill="#F3F3F3">OWNER DEPENDENCY IS THE MOST</text>
  <text x="320" y="528" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="0.3" fill="#F3F3F3"><tspan fill="#DFFF00">EXPENSIVE</tspan> PROBLEM IN YOUR BUSINESS.</text>
</svg>
