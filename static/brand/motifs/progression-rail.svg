<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 160" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" role="img" aria-label="Transferability progression">
  <title>Progression — dependent to exit ready</title>
  <rect width="1040" height="160" fill="#050505"/>
  <!-- baseline -->
  <line x1="60" y1="80" x2="980" y2="80" stroke="#2D2D31" stroke-width="1.5"/>
  <g text-anchor="middle">
    <!-- nodes evenly spaced at x = 80,300,520,740,960 -->
    <g>
      <circle cx="80" cy="80" r="9" fill="#050505" stroke="#2D2D31" stroke-width="2"/>
      <text x="80" y="120" font-size="14" font-weight="700" letter-spacing="1" fill="#9A9A9F">DEPENDENT</text>
    </g>
    <g>
      <circle cx="300" cy="80" r="9" fill="#050505" stroke="#2D2D31" stroke-width="2"/>
      <text x="300" y="120" font-size="14" font-weight="700" letter-spacing="1" fill="#9A9A9F">DOCUMENTED</text>
    </g>
    <g>
      <circle cx="520" cy="80" r="9" fill="#050505" stroke="#2D2D31" stroke-width="2"/>
      <text x="520" y="120" font-size="14" font-weight="700" letter-spacing="1" fill="#9A9A9F">SYSTEMIZED</text>
    </g>
    <g>
      <circle cx="740" cy="80" r="9" fill="#050505" stroke="#DFFF00" stroke-width="2"/>
      <text x="740" y="120" font-size="14" font-weight="700" letter-spacing="1" fill="#F3F3F3">TRANSFERABLE</text>
    </g>
    <g>
      <circle cx="960" cy="80" r="11" fill="#DFFF00"/>
      <text x="960" y="120" font-size="14" font-weight="800" letter-spacing="1" fill="#DFFF00">EXIT READY</text>
    </g>
  </g>
</svg>
