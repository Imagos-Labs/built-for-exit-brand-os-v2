<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif" role="img" aria-label="Five-pillar exit-readiness radar">
  <title>Exit-readiness radar — five pillars of transferability</title>
  <rect width="520" height="500" fill="#050505"/>
  <!-- grid rings (pentagon) -->
  <g fill="none" stroke="#2D2D31" stroke-width="1">
    <polygon points="260,165 340.85,223.75 309.95,318.8 210.05,318.8 179.15,223.75"/>
    <polygon points="260,80 421.7,197.5 359.9,387.6 160.1,387.6 98.3,197.5"/>
  </g>
  <!-- axes -->
  <g stroke="#2D2D31" stroke-width="1">
    <line x1="260" y1="250" x2="260" y2="80"/>
    <line x1="260" y1="250" x2="421.7" y2="197.5"/>
    <line x1="260" y1="250" x2="359.9" y2="387.6"/>
    <line x1="260" y1="250" x2="160.1" y2="387.6"/>
    <line x1="260" y1="250" x2="98.3" y2="197.5"/>
  </g>
  <!-- data polygon (Doc85 Sys63 Ops70 Rev61 Fin82) -->
  <polygon points="260,105.5 361.9,216.9 329.9,346.3 199.1,333.9 127.4,206.9"
           fill="#DFFF00" fill-opacity="0.16" stroke="#DFFF00" stroke-width="2"/>
  <g fill="#DFFF00">
    <circle cx="260" cy="105.5" r="3.5"/><circle cx="361.9" cy="216.9" r="3.5"/>
    <circle cx="329.9" cy="346.3" r="3.5"/><circle cx="199.1" cy="333.9" r="3.5"/>
    <circle cx="127.4" cy="206.9" r="3.5"/>
  </g>
  <!-- no axis labels: kept abstract to avoid false specificity about named pillars -->
  <text x="260" y="468" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="14" letter-spacing="2" fill="#9A9A9F">EXIT READINESS INDEX™</text>
</svg>
